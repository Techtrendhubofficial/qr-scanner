<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payment Successful! Unlocking... - Pavilion QR Pro</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1106170858552120');
    fbq('track', 'PageView');
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    :root {
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.35);
      --bg: #000000;
      --card-bg: #09090b;
      --border: rgba(0, 255, 136, 0.25);
    }
    body {
      background-color: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-x: hidden;
    }
    .glow-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 2rem;
      max-width: 460px;
      width: 100%;
      padding: 2.75rem 2rem;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 255, 136, 0.15), 0 25px 60px -15px rgba(0, 0, 0, 0.9);
      animation: enterCard 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes enterCard {
      from { transform: translateY(20px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .icon-box {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--accent);
      box-shadow: 0 0 35px var(--accent-glow);
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
      to { box-shadow: 0 0 45px rgba(0, 255, 136, 0.6); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.35);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      color: #ffffff;
      line-height: 1.2;
    }
    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .plan-pill {
      color: var(--accent);
      font-weight: 800;
      text-transform: capitalize;
    }
    .loader-bar {
      width: 100%;
      height: 6px;
      background: #18181b;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 1.75rem;
      position: relative;
    }
    .loader-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: fillBar 1.8s ease-in-out forwards;
    }
    @keyframes fillBar {
      0% { width: 0%; }
      60% { width: 80%; }
      100% { width: 100%; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--accent);
      color: #000000;
      font-weight: 900;
      font-size: 1rem;
      padding: 1.05rem 1.5rem;
      border-radius: 1.25rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #33ff9f;
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -5px rgba(0, 255, 136, 0.5);
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="card">
    <div class="icon-box">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>

    <div class="badge">
      <span>●</span>
      <span id="badgeText">Payment Confirmed</span>
    </div>

    <h1>Payment Successful! Unlocking...</h1>
    <p>Your <span class="plan-pill" id="planName">Starter</span> plan has been activated. Scan limits removed and full unlimited access unlocked!</p>

    <div class="loader-bar">
      <div class="loader-fill"></div>
    </div>

    <a href="/index.html" class="btn" id="homeBtn">
      <span>Return to Scanner</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

  <script>
    // Read ?plan= from URL
    const urlParams = new URLSearchParams(window.location.search);
    const plan = (urlParams.get('plan') || 'starter').toLowerCase();

    // 1. Unlock scans, store plan, reset scan count
    try {
      localStorage.setItem('paidPlan', plan);
      localStorage.setItem('isPremium', 'true');
      localStorage.removeItem('scanCount');

      // Update pavilion_qr_subscription_v1 object (and legacy fallback)
      const subData = {
        isPro: true,
        trialActive: false,
        trialExpiresAt: null,
        purchasedAt: Date.now(),
        planType: plan,
        orderId: 'STRIPE.' + plan.toUpperCase() + '.' + Date.now().toString(36).toUpperCase()
      };
      localStorage.setItem('pavilion_qr_subscription_v1', JSON.stringify(subData));
    } catch (e) {
      console.error('Failed to update localStorage:', e);
    }

    // Update UI text
    const planNameEl = document.getElementById('planName');
    if (planNameEl) {
      planNameEl.innerText = plan.toUpperCase();
    }

    // Meta Pixel Tracking
    if (window.fbq) {
      fbq('track', 'Purchase', {
        value: 59,
        currency: 'USD',
        content_name: 'Pavilion QR Pro Annual VIP ($59/yr)'
      });
    }

    // Celebrate with confetti
    if (window.confetti) {
      confetti({
        particleCount: 140,
        spread: 85,
        origin: { y: 0.6 },
        colors: ['#00ff88', '#33ff9f', '#ffffff', '#00cc6a']
      });
    }

    // Auto-redirect to index.html after 1.8 seconds
    setTimeout(function() {
      window.location.href = '/index.html';
    }, 1800);
  </script>
</body>
</html>
